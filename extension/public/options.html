<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ABO Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
        max-width: 420px;
        background: #0f1419;
        color: #e7ecf3;
      }
      label {
        display: block;
        margin: 12px 0 4px;
        color: #8b9bb4;
        font-size: 12px;
      }
      input[type="text"],
      input[type="number"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #2a3548;
        background: #1a2332;
        color: #e7ecf3;
      }
      button {
        margin-top: 16px;
        padding: 8px 14px;
        border-radius: 6px;
        border: 1px solid #2a3548;
        background: #243044;
        color: #e7ecf3;
        cursor: pointer;
      }
      #msg {
        margin-top: 10px;
        font-size: 12px;
        color: #3dd68c;
      }
      .hint {
        color: #8b9bb4;
        font-size: 11px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <h1 style="font-size: 16px">Observer connection</h1>
    <label for="observerUrl">Observer base URL (LAN / deployed server)</label>
    <input id="observerUrl" type="text" spellcheck="false" placeholder="http://192.168.1.50:3847" />
    <label for="apiToken">API token (same as server ABO_API_TOKEN)</label>
    <input id="apiToken" type="password" spellcheck="false" autocomplete="off" />
    <label for="maxVisibleTextChars">Max visible text chars</label>
    <input id="maxVisibleTextChars" type="number" min="500" max="20000" />
    <label for="maxQueueSize">Max offline queue size</label>
    <input id="maxQueueSize" type="number" min="10" max="2000" />
    <button id="save" type="button">Save</button>
    <p id="msg"></p>
    <p class="hint">Backend must be reachable from this PC. Extension alone is not enough.</p>
    <script type="module" src="options.js"></script>
  </body>
</html>
