<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phase 2 Demo App</title>
    <style>
      body {
        font-family: Georgia, "Times New Roman", serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem 3rem;
        background: linear-gradient(180deg, #f3efe6, #ddd4c4);
        color: #1c1917;
      }
      h1 { font-size: 1.75rem; }
      .panel {
        margin: 1rem 0;
        padding: 1rem;
        border: 1px solid #c4b5a0;
        background: rgba(255, 255, 255, 0.6);
      }
      button {
        font: inherit;
        margin: 0.3rem 0.25rem 0.3rem 0;
        padding: 0.45rem 0.75rem;
        cursor: pointer;
      }
      #log {
        white-space: pre-wrap;
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
        min-height: 5rem;
      }
      input { font: inherit; padding: 0.35rem; margin: 0.25rem 0; }
    </style>
  </head>
  <body>
    <h1>Phase 2 Demo Application</h1>
    <p>
      Intentional behaviors for Observer → Controller → AI issue detection.
      This page does not auto-modify anything.
    </p>

    <div class="panel">
      <h2>A. Working page / successful API</h2>
      <button id="btn-ok" type="button">Call working API</button>
    </div>

    <div class="panel">
      <h2>B. Console error</h2>
      <button id="btn-console" type="button">Trigger console.error</button>
      <button id="btn-throw" type="button">Trigger uncaught TypeError</button>
    </div>

    <div class="panel">
      <h2>C. Failed API / 404</h2>
      <button id="btn-404" type="button">Trigger HTTP 404</button>
      <button id="btn-netfail" type="button">Trigger network failure</button>
    </div>

    <div class="panel">
      <h2>D. HTTP 500 endpoint</h2>
      <button id="btn-500" type="button">Trigger HTTP 500</button>
      <button id="btn-login-500" type="button">Fake login (500)</button>
      <div>
        <label>Password (never stored by observer)
          <input id="password" name="password" type="password" value="secret-should-redact" />
        </label>
      </div>
    </div>

    <div class="panel">
      <h2>E. Broken button</h2>
      <button id="btn-broken" type="button">Broken action</button>
    </div>

    <div class="panel">
      <h2>Log</h2>
      <div id="log"></div>
    </div>

    <p><a href="/">Back to dashboard</a></p>

    <script>
      const logEl = document.getElementById("log");
      function log(msg) {
        logEl.textContent += msg + "\\n";
      }

      document.getElementById("btn-ok").onclick = async () => {
        const res = await fetch("/phase2-demo/api/ok");
        log("OK API status " + res.status);
      };

      document.getElementById("btn-console").onclick = () => {
        console.error("Phase2 demo deliberate console error");
        log("console.error fired");
      };

      document.getElementById("btn-throw").onclick = () => {
        setTimeout(() => {
          const obj = null;
          // deliberate crash
          console.log(obj.doesNotExist.crash);
        }, 0);
        log("uncaught scheduled");
      };

      document.getElementById("btn-404").onclick = async () => {
        const res = await fetch("/phase2-demo/api/missing");
        log("404 status " + res.status);
      };

      document.getElementById("btn-netfail").onclick = async () => {
        try {
          await fetch("http://127.0.0.1:9/down");
        } catch (e) {
          log("network failure " + e);
        }
      };

      document.getElementById("btn-500").onclick = async () => {
        const res = await fetch("/phase2-demo/api/crash");
        log("500 status " + res.status);
      };

      document.getElementById("btn-login-500").onclick = async () => {
        const password = document.getElementById("password").value;
        const res = await fetch("/phase2-demo/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: "demo", password }),
        });
        log("login API status " + res.status + " (password must not be stored)");
      };

      document.getElementById("btn-broken").onclick = () => {
        console.error("Broken action handler failed");
        fetch("/phase2-demo/api/crash").then((r) => log("broken → " + r.status));
      };
    </script>
  </body>
</html>
